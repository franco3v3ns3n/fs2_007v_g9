<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | HuertoHogar</title>
</head>
<body>
  <header>
    <p>HuertoHogar</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="blog.html">Blog</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registro</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contacto</h1>
      <p>
        Si tienes una consulta sobre HuertoHogar o nuestros productos, completa el
        siguiente formulario para comunicarte con nosotros.
      </p>

      <form id="formContacto" action="#" method="post" novalidate>
        <p>
          <label for="nombreContacto">Nombre:</label><br>
          <input type="text" id="nombreContacto" name="nombreContacto" required>
          <small id="errorNombreContacto"></small>
        </p>

        <p>
          <label for="correoContacto">Correo electrónico:</label><br>
          <input type="email" id="correoContacto" name="correoContacto" required>
          <small id="errorCorreoContacto"></small>
        </p>

        <p>
          <label for="comentarioContacto">Comentario:</label><br>
          <textarea id="comentarioContacto" name="comentarioContacto" rows="6" required></textarea>
          <small id="errorComentarioContacto"></small>
        </p>

        <button type="submit">Enviar</button>
        <p id="mensajeContacto"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>HuertoHogar</p>
  </footer>
  <script src="js/funciones.js"></script>
</body>
</html>
