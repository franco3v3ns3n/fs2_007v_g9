<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar producto — Administración | HuertoHogar</title>
</head>
<body>
  <header>
    <p>HuertoHogar — Administración</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Volver a tienda</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Editar producto</h1>
      <p>Revisa los datos del producto representativo del prototipo administrativo.</p>

      <form id="formEditarProducto" action="#" method="post">
        <p>
          <label for="codigoEditarProducto">Código:</label><br>
          <input type="text" id="codigoEditarProducto" name="codigoEditarProducto" value="FR001" required>
        </p>

        <p>
          <label for="nombreEditarProducto">Nombre:</label><br>
          <input type="text" id="nombreEditarProducto" name="nombreEditarProducto" value="Manzanas Fuji" required>
        </p>

        <p>
          <label for="categoriaEditarProducto">Categoría:</label><br>
          <select id="categoriaEditarProducto" name="categoriaEditarProducto" required>
            <option value="Frutas Frescas" selected>Frutas Frescas</option>
            <option value="Verduras Orgánicas">Verduras Orgánicas</option>
            <option value="Productos Orgánicos">Productos Orgánicos</option>
            <option value="Productos Lácteos">Productos Lácteos</option>
          </select>
        </p>

        <p>
          <label for="precioEditarProducto">Precio:</label><br>
          <input type="number" id="precioEditarProducto" name="precioEditarProducto" value="1200" required>
        </p>

        <p>
          <label for="stockEditarProducto">Stock:</label><br>
          <input type="number" id="stockEditarProducto" name="stockEditarProducto" value="150" required>
        </p>

        <p>
          <label for="descripcionEditarProducto">Descripción:</label><br>
          <textarea id="descripcionEditarProducto" name="descripcionEditarProducto" required>Manzanas Fuji crujientes y dulces, cultivadas en el Valle del Maule. Perfectas para meriendas saludables o como ingrediente en postres. Estas manzanas son conocidas por su textura firme y su sabor equilibrado entre dulce y ácido.</textarea>
        </p>

        <button type="submit">Guardar cambios</button>
      </form>

      <p><a href="productos.html">Volver a Productos</a></p>
    </section>
  </main>

  <footer>
    <p>HuertoHogar</p>
  </footer>
</body>
</html>
