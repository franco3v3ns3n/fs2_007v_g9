<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-dark py-3" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="img/logo-huertohogar.png" class="logo-huertohogar" alt="Logo de HuertoHogar">
                    HuertoHogar
                </a>
                <div class="d-flex flex-wrap gap-3">
                    <a class="text-white" href="index.html">Inicio</a>
                    <a class="text-white" href="productos.html">Productos</a>
                    <a class="text-white" href="nosotros.html">Nosotros</a>
                    <a class="text-white" href="blog.html">Blog</a>
                    <a class="text-white" href="contacto.html" aria-current="page">Contacto</a>
                    <a class="text-white" href="login.html">Iniciar sesión</a>
                    <a class="text-white" href="registro.html">Registro</a>
                    <a class="text-white" href="carrito.html">
                        Carrito (<span id="contadorCarrito">0</span>)
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <h1>Contacto</h1>
                <form id="formContacto" novalidate>
                    <div class="mb-3">
                        <label for="nombreContacto" class="form-label">Nombre</label>
                        <input type="text" id="nombreContacto" class="form-control" autocomplete="name">
                    </div>
                    <div class="mb-3">
                        <label for="correoContacto" class="form-label">Correo (opcional)</label>
                        <input type="email" id="correoContacto" class="form-control" autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label for="comentarioContacto" class="form-label">Comentario</label>
                        <textarea id="comentarioContacto" class="form-control" rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <p id="mensajeContacto" class="mt-3"></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-4">
        <div class="container">
            <p class="mb-0">HuertoHogar · Del campo a tu hogar.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
