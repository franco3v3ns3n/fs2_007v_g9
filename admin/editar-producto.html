<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto — Administración | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100 admin-page">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación administrativa">
        <div class="container">
          <span class="navbar-brand mb-0">HuertoHogar <small class="d-block d-lg-inline fs-6">— Administración</small></span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdministrativo" aria-controls="menuAdministrativo" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuAdministrativo">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
              <li class="nav-item"><a class="nav-link" href="../index.html">Volver a tienda</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Editar producto</h1>
              <p>Revisa los datos del producto representativo del prototipo administrativo.</p>

              <form id="formEditarProducto" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="codigoEditarProducto">Código:</label>
                  <input class="form-control" type="text" id="codigoEditarProducto" name="codigoEditarProducto" value="FR001" required aria-describedby="errorCodigoEditarProducto">
                  <small class="text-danger d-block mt-1" id="errorCodigoEditarProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="nombreEditarProducto">Nombre:</label>
                  <input class="form-control" type="text" id="nombreEditarProducto" name="nombreEditarProducto" value="Manzanas Fuji" required aria-describedby="errorNombreEditarProducto">
                  <small class="text-danger d-block mt-1" id="errorNombreEditarProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="categoriaEditarProducto">Categoría:</label>
                  <select class="form-select" id="categoriaEditarProducto" name="categoriaEditarProducto" required aria-describedby="errorCategoriaEditarProducto">
                    <option value="Frutas Frescas" selected>Frutas Frescas</option>
                    <option value="Verduras Orgánicas">Verduras Orgánicas</option>
                    <option value="Productos Orgánicos">Productos Orgánicos</option>
                    <option value="Productos Lácteos">Productos Lácteos</option>
                  </select>
                  <small class="text-danger d-block mt-1" id="errorCategoriaEditarProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="precioEditarProducto">Precio:</label>
                  <input class="form-control" type="number" id="precioEditarProducto" name="precioEditarProducto" value="1200" required aria-describedby="errorPrecioEditarProducto">
                  <small class="text-danger d-block mt-1" id="errorPrecioEditarProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="stockEditarProducto">Stock:</label>
                  <input class="form-control" type="number" id="stockEditarProducto" name="stockEditarProducto" value="150" required aria-describedby="errorStockEditarProducto">
                  <small class="text-danger d-block mt-1" id="errorStockEditarProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="descripcionEditarProducto">Descripción:</label>
                  <textarea class="form-control" id="descripcionEditarProducto" name="descripcionEditarProducto" required aria-describedby="errorDescripcionEditarProducto">Manzanas Fuji crujientes y dulces, cultivadas en el Valle del Maule. Perfectas para meriendas saludables o como ingrediente en postres. Estas manzanas son conocidas por su textura firme y su sabor equilibrado entre dulce y ácido.</textarea>
                  <small class="text-danger d-block mt-1" id="errorDescripcionEditarProducto"></small>
                </div>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <p class="text-success mt-3 mb-0" id="mensajeEditarProducto" role="status" aria-live="polite"></p>
              </form>

              <p><a href="productos.html" class="btn btn-outline-secondary">Volver a Productos</a></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="../js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
