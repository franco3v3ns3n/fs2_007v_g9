<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto — Administración | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100 admin-page">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación administrativa">
        <div class="container">
          <span class="navbar-brand mb-0">HuertoHogar <small class="d-block d-lg-inline fs-6">— Administración</small></span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdministrativo" aria-controls="menuAdministrativo" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuAdministrativo">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
              <li class="nav-item"><a class="nav-link" href="../index.html">Volver a tienda</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Nuevo producto</h1>
              <p>Completa los datos para representar un nuevo producto en el prototipo administrativo.</p>

              <form id="formNuevoProducto" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="codigoNuevoProducto">Código:</label>
                  <input class="form-control" type="text" id="codigoNuevoProducto" name="codigoNuevoProducto" required aria-describedby="errorCodigoNuevoProducto">
                  <small class="text-danger d-block mt-1" id="errorCodigoNuevoProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="nombreNuevoProducto">Nombre:</label>
                  <input class="form-control" type="text" id="nombreNuevoProducto" name="nombreNuevoProducto" required aria-describedby="errorNombreNuevoProducto">
                  <small class="text-danger d-block mt-1" id="errorNombreNuevoProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="categoriaNuevoProducto">Categoría:</label>
                  <select class="form-select" id="categoriaNuevoProducto" name="categoriaNuevoProducto" required aria-describedby="errorCategoriaNuevoProducto">
                    <option value="">Selecciona una categoría</option>
                    <option value="Frutas Frescas">Frutas Frescas</option>
                    <option value="Verduras Orgánicas">Verduras Orgánicas</option>
                    <option value="Productos Orgánicos">Productos Orgánicos</option>
                    <option value="Productos Lácteos">Productos Lácteos</option>
                  </select>
                  <small class="text-danger d-block mt-1" id="errorCategoriaNuevoProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="precioNuevoProducto">Precio:</label>
                  <input class="form-control" type="number" id="precioNuevoProducto" name="precioNuevoProducto" required aria-describedby="errorPrecioNuevoProducto">
                  <small class="text-danger d-block mt-1" id="errorPrecioNuevoProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="stockNuevoProducto">Stock:</label>
                  <input class="form-control" type="number" id="stockNuevoProducto" name="stockNuevoProducto" required aria-describedby="errorStockNuevoProducto">
                  <small class="text-danger d-block mt-1" id="errorStockNuevoProducto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="descripcionNuevoProducto">Descripción:</label>
                  <textarea class="form-control" id="descripcionNuevoProducto" name="descripcionNuevoProducto" required aria-describedby="errorDescripcionNuevoProducto"></textarea>
                  <small class="text-danger d-block mt-1" id="errorDescripcionNuevoProducto"></small>
                </div>

                <button type="submit" class="btn btn-primary">Guardar producto</button>
                <p class="text-success mt-3 mb-0" id="mensajeNuevoProducto" role="status" aria-live="polite"></p>
              </form>

              <p><a href="productos.html" class="btn btn-outline-secondary">Volver a Productos</a></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="../js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
