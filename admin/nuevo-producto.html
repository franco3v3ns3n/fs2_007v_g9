<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto — Administración | HuertoHogar</title>
</head>
<body>
  <header>
    <p>HuertoHogar — Administración</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Volver a tienda</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Nuevo producto</h1>
      <p>Completa los datos para representar un nuevo producto en el prototipo administrativo.</p>

      <form id="formNuevoProducto" action="#" method="post">
        <p>
          <label for="codigoNuevoProducto">Código:</label><br>
          <input type="text" id="codigoNuevoProducto" name="codigoNuevoProducto" required>
        </p>

        <p>
          <label for="nombreNuevoProducto">Nombre:</label><br>
          <input type="text" id="nombreNuevoProducto" name="nombreNuevoProducto" required>
        </p>

        <p>
          <label for="categoriaNuevoProducto">Categoría:</label><br>
          <select id="categoriaNuevoProducto" name="categoriaNuevoProducto" required>
            <option value="">Selecciona una categoría</option>
            <option value="Frutas Frescas">Frutas Frescas</option>
            <option value="Verduras Orgánicas">Verduras Orgánicas</option>
            <option value="Productos Orgánicos">Productos Orgánicos</option>
            <option value="Productos Lácteos">Productos Lácteos</option>
          </select>
        </p>

        <p>
          <label for="precioNuevoProducto">Precio:</label><br>
          <input type="number" id="precioNuevoProducto" name="precioNuevoProducto" required>
        </p>

        <p>
          <label for="stockNuevoProducto">Stock:</label><br>
          <input type="number" id="stockNuevoProducto" name="stockNuevoProducto" required>
        </p>

        <p>
          <label for="descripcionNuevoProducto">Descripción:</label><br>
          <textarea id="descripcionNuevoProducto" name="descripcionNuevoProducto" required></textarea>
        </p>

        <button type="submit">Guardar producto</button>
      </form>

      <p><a href="productos.html">Volver a Productos</a></p>
    </section>
  </main>

  <footer>
    <p>HuertoHogar</p>
  </footer>
</body>
</html>
