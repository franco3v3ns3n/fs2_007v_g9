<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación principal">
        <div class="container">
          <span class="navbar-brand mb-0"><img src="img/logo/logo-huertohogar.webp" alt="Logo de HuertoHogar" class="brand-logo" width="1000" height="1000">HuertoHogar</span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
              <li class="nav-item"><a class="nav-link" href="registro.html">Registro</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Contacto</h1>
              <p>
                Si tienes una consulta sobre HuertoHogar o nuestros productos, completa el
                siguiente formulario para comunicarte con nosotros.
              </p>

              <form id="formContacto" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="nombreContacto">Nombre:</label>
                  <input class="form-control" type="text" id="nombreContacto" name="nombreContacto" required aria-describedby="errorNombreContacto">
                  <small class="text-danger d-block mt-1" id="errorNombreContacto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="correoContacto">Correo electrónico:</label>
                  <input class="form-control" type="email" id="correoContacto" name="correoContacto" required aria-describedby="errorCorreoContacto">
                  <small class="text-danger d-block mt-1" id="errorCorreoContacto"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="comentarioContacto">Comentario:</label>
                  <textarea class="form-control" id="comentarioContacto" name="comentarioContacto" rows="6" required aria-describedby="errorComentarioContacto"></textarea>
                  <small class="text-danger d-block mt-1" id="errorComentarioContacto"></small>
                </div>

                <button type="submit" class="btn btn-primary">Enviar</button>
                <p class="text-success mt-3 mb-0" id="mensajeContacto" role="status" aria-live="polite"></p>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
