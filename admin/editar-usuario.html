<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar usuario — Administración | HuertoHogar</title>
</head>
<body>
  <header>
    <p>HuertoHogar — Administración</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Volver a tienda</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Editar usuario</h1>
      <p>Revisa los datos del usuario representativo del prototipo administrativo.</p>

      <form id="formEditarUsuario" action="#" method="post" novalidate>
        <p>
          <label for="nombreEditarUsuario">Nombre:</label><br>
          <input type="text" id="nombreEditarUsuario" name="nombreEditarUsuario" value="Ana" required>
          <small id="errorNombreEditarUsuario"></small>
        </p>

        <p>
          <label for="apellidoEditarUsuario">Apellido:</label><br>
          <input type="text" id="apellidoEditarUsuario" name="apellidoEditarUsuario" value="Torres" required>
          <small id="errorApellidoEditarUsuario"></small>
        </p>

        <p>
          <label for="correoEditarUsuario">Correo electrónico:</label><br>
          <input type="email" id="correoEditarUsuario" name="correoEditarUsuario" value="ana.torres@example.com" required>
          <small id="errorCorreoEditarUsuario"></small>
        </p>

        <p>
          <label for="telefonoEditarUsuario">Teléfono:</label><br>
          <span>+56</span>
          <input type="tel" id="telefonoEditarUsuario" name="telefonoEditarUsuario" value="912345678" required>
          <small id="errorTelefonoEditarUsuario"></small>
        </p>

        <p>
          <label for="direccionEditarUsuario">Dirección:</label><br>
          <input type="text" id="direccionEditarUsuario" name="direccionEditarUsuario" value="Dirección simulada 123, Santiago" required>
          <small id="errorDireccionEditarUsuario"></small>
        </p>

        <button type="submit">Guardar cambios</button>
        <p id="mensajeEditarUsuario"></p>
      </form>

      <p><a href="usuarios.html">Volver a Usuarios</a></p>
    </section>
  </main>

  <footer>
    <p>HuertoHogar</p>
  </footer>
  <script src="../js/funciones.js"></script>
</body>
</html>
