<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario — Administración | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100 admin-page">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación administrativa">
        <div class="container">
          <span class="navbar-brand mb-0"><img src="../img/logo/logo-huertohogar.webp" alt="Logo de HuertoHogar" class="brand-logo" width="1200" height="900">HuertoHogar <small class="d-block d-lg-inline fs-6">— Administración</small></span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdministrativo" aria-controls="menuAdministrativo" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuAdministrativo">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
              <li class="nav-item"><a class="nav-link" href="../index.html">Volver a tienda</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Nuevo usuario</h1>
              <p>Completa los datos para representar un nuevo usuario en el prototipo administrativo.</p>

              <form id="formNuevoUsuario" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="nombreNuevoUsuario">Nombre:</label>
                  <input class="form-control" type="text" id="nombreNuevoUsuario" name="nombreNuevoUsuario" required aria-describedby="errorNombreNuevoUsuario">
                  <small class="text-danger d-block mt-1" id="errorNombreNuevoUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="apellidoNuevoUsuario">Apellido:</label>
                  <input class="form-control" type="text" id="apellidoNuevoUsuario" name="apellidoNuevoUsuario" required aria-describedby="errorApellidoNuevoUsuario">
                  <small class="text-danger d-block mt-1" id="errorApellidoNuevoUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="correoNuevoUsuario">Correo electrónico:</label>
                  <input class="form-control" type="email" id="correoNuevoUsuario" name="correoNuevoUsuario" required aria-describedby="errorCorreoNuevoUsuario">
                  <small class="text-danger d-block mt-1" id="errorCorreoNuevoUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="telefonoNuevoUsuario">Teléfono:</label>
                  <div class="input-group">
                    <span class="input-group-text" id="prefijoTelefonoNuevoUsuario">+56</span>
                    <input class="form-control" type="tel" id="telefonoNuevoUsuario" name="telefonoNuevoUsuario" aria-describedby="prefijoTelefonoNuevoUsuario errorTelefonoNuevoUsuario" required>
                  </div>
                  <small class="text-danger d-block mt-1" id="errorTelefonoNuevoUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="direccionNuevoUsuario">Dirección:</label>
                  <input class="form-control" type="text" id="direccionNuevoUsuario" name="direccionNuevoUsuario" required aria-describedby="errorDireccionNuevoUsuario">
                  <small class="text-danger d-block mt-1" id="errorDireccionNuevoUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="passwordNuevoUsuario">Contraseña:</label>
                  <input class="form-control" type="password" id="passwordNuevoUsuario" name="passwordNuevoUsuario" required aria-describedby="errorPasswordNuevoUsuario">
                  <small class="text-danger d-block mt-1" id="errorPasswordNuevoUsuario"></small>
                </div>

                <button type="submit" class="btn btn-primary">Guardar usuario</button>
                <p class="text-success mt-3 mb-0" id="mensajeNuevoUsuario" role="status" aria-live="polite"></p>
              </form>

              <p><a href="usuarios.html" class="btn btn-outline-secondary">Volver a Usuarios</a></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="../js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
