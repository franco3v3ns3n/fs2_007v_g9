<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación principal">
        <div class="container">
          <span class="navbar-brand mb-0">HuertoHogar</span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="registro.html">Registro</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Registro</h1>
              <p>Completa tus datos para crear tu cuenta en HuertoHogar.</p>

              <form id="formRegistro" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="nombreRegistro">Nombre:</label>
                  <input class="form-control" type="text" id="nombreRegistro" name="nombreRegistro" required aria-describedby="errorNombreRegistro">
                  <small class="text-danger d-block mt-1" id="errorNombreRegistro"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="apellidoRegistro">Apellido:</label>
                  <input class="form-control" type="text" id="apellidoRegistro" name="apellidoRegistro" required aria-describedby="errorApellidoRegistro">
                  <small class="text-danger d-block mt-1" id="errorApellidoRegistro"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="correoRegistro">Correo electrónico:</label>
                  <input class="form-control" type="email" id="correoRegistro" name="correoRegistro" required aria-describedby="errorCorreoRegistro">
                  <small class="text-danger d-block mt-1" id="errorCorreoRegistro"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="telefonoRegistro">Teléfono:</label>
                  <div class="input-group">
                    <span class="input-group-text" id="prefijoTelefonoRegistro">+56</span>
                    <input class="form-control" type="tel" id="telefonoRegistro" name="telefonoRegistro" aria-describedby="prefijoTelefonoRegistro errorTelefonoRegistro" required>
                  </div>
                  <small class="text-danger d-block mt-1" id="errorTelefonoRegistro"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="passwordRegistro">Contraseña:</label>
                  <input class="form-control" type="password" id="passwordRegistro" name="passwordRegistro" required aria-describedby="errorPasswordRegistro">
                  <small class="text-danger d-block mt-1" id="errorPasswordRegistro"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="confirmarPasswordRegistro">Confirmar contraseña:</label>
                  <input class="form-control" type="password" id="confirmarPasswordRegistro" name="confirmarPasswordRegistro" required aria-describedby="errorConfirmarPasswordRegistro">
                  <small class="text-danger d-block mt-1" id="errorConfirmarPasswordRegistro"></small>
                </div>

                <button type="submit" class="btn btn-primary">Registrarse</button>
                <p class="text-success mt-3 mb-0" id="mensajeRegistro" role="status" aria-live="polite"></p>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
