<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario — Administración | HuertoHogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="d-flex flex-column min-vh-100 admin-page">
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Navegación administrativa">
        <div class="container">
          <span class="navbar-brand mb-0"><img src="../img/logo/logo-huertohogar.webp" alt="Logo de HuertoHogar" class="brand-logo" width="1200" height="900">HuertoHogar <small class="d-block d-lg-inline fs-6">— Administración</small></span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdministrativo" aria-controls="menuAdministrativo" aria-expanded="false" aria-label="Mostrar u ocultar menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuAdministrativo">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
              <li class="nav-item"><a class="nav-link" href="../index.html">Volver a tienda</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h2 mb-3">Editar usuario</h1>
              <p>Revisa los datos del usuario representativo del prototipo administrativo.</p>

              <form id="formEditarUsuario" action="#" method="post" novalidate class="mt-4">
                <div class="mb-3">
                  <label class="form-label" for="nombreEditarUsuario">Nombre:</label>
                  <input class="form-control" type="text" id="nombreEditarUsuario" name="nombreEditarUsuario" value="Ana" required aria-describedby="errorNombreEditarUsuario">
                  <small class="text-danger d-block mt-1" id="errorNombreEditarUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="apellidoEditarUsuario">Apellido:</label>
                  <input class="form-control" type="text" id="apellidoEditarUsuario" name="apellidoEditarUsuario" value="Torres" required aria-describedby="errorApellidoEditarUsuario">
                  <small class="text-danger d-block mt-1" id="errorApellidoEditarUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="correoEditarUsuario">Correo electrónico:</label>
                  <input class="form-control" type="email" id="correoEditarUsuario" name="correoEditarUsuario" value="ana.torres@example.com" required aria-describedby="errorCorreoEditarUsuario">
                  <small class="text-danger d-block mt-1" id="errorCorreoEditarUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="telefonoEditarUsuario">Teléfono:</label>
                  <div class="input-group">
                    <span class="input-group-text" id="prefijoTelefonoEditarUsuario">+56</span>
                    <input class="form-control" type="tel" id="telefonoEditarUsuario" name="telefonoEditarUsuario" value="912345678" aria-describedby="prefijoTelefonoEditarUsuario errorTelefonoEditarUsuario" required>
                  </div>
                  <small class="text-danger d-block mt-1" id="errorTelefonoEditarUsuario"></small>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="direccionEditarUsuario">Dirección:</label>
                  <input class="form-control" type="text" id="direccionEditarUsuario" name="direccionEditarUsuario" value="Dirección simulada 123, Santiago" required aria-describedby="errorDireccionEditarUsuario">
                  <small class="text-danger d-block mt-1" id="errorDireccionEditarUsuario"></small>
                </div>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <p class="text-success mt-3 mb-0" id="mensajeEditarUsuario" role="status" aria-live="polite"></p>
              </form>

              <p><a href="usuarios.html" class="btn btn-outline-secondary">Volver a Usuarios</a></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body-tertiary py-3">
      <div class="container">
        <p class="mb-0 text-body-secondary">HuertoHogar</p>
      </div>
    </footer>
    <script src="../js/funciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
